<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="PDF Mate: fill, sign, stamp, mark up, merge and reorder PDFs offline. Nothing leaves your device.">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PDF Mate">
<title>PDF Mate</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>(function(){try{var t=localStorage.getItem('pdfmate.theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
/* Layout: macOS document window. Glass toolbar on top, glass page sidebar left, document canvas centre,
   format bar under the toolbar. On phones the tool strip becomes a floating glass dock at the bottom. */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --win: #f5f5f7;
  --canvas: #e4e4e9;
  --glass: rgba(250,250,252,.72);
  --glass-strong: rgba(255,255,255,.86);
  --glass-edge: rgba(255,255,255,.75);
  --sidebar: rgba(240,240,244,.70);
  --label: #1d1d1f;
  --label-2: #48484d;
  --label-3: #6e6e73;
  --sep: rgba(0,0,0,.10);
  --sep-strong: rgba(0,0,0,.16);
  --fill: rgba(0,0,0,.05);
  --fill-2: rgba(0,0,0,.08);
  --fill-hover: rgba(0,0,0,.07);
  --control: #ffffff;
  --accent: #007aff;
  --accent-ink: #ffffff;
  --accent-soft: rgba(0,122,255,.12);
  --danger: #d70015;
  --danger-soft: rgba(215,0,21,.10);
  --ok: #248a3d;
  --page-shadow: 0 1px 2px rgba(0,0,0,.10), 0 8px 24px rgba(0,0,0,.10);
  --pop-shadow: 0 0 0 .5px rgba(0,0,0,.12), 0 10px 30px rgba(0,0,0,.16), 0 2px 8px rgba(0,0,0,.08);
  --ctrl-shadow: 0 0 0 .5px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.10);
  --scrim: rgba(0,0,0,.28);
  --r-win: 16px; --r: 12px; --r-sm: 8px;
  --ease: cubic-bezier(.2,.8,.2,1);
  --tb-h: 56px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --win:#1c1c1e; --canvas:#111113; --glass:rgba(44,44,48,.66); --glass-strong:rgba(50,50,54,.88); --glass-edge:rgba(255,255,255,.10);
  --sidebar:rgba(36,36,40,.66); --label:#f5f5f7; --label-2:#d1d1d6; --label-3:#a1a1a6; --sep:rgba(255,255,255,.10); --sep-strong:rgba(255,255,255,.16);
  --fill:rgba(255,255,255,.07); --fill-2:rgba(255,255,255,.11); --fill-hover:rgba(255,255,255,.10); --control:#636366;
  --accent:#0a84ff; --accent-ink:#ffffff; --accent-soft:rgba(10,132,255,.22); --danger:#ff453a; --danger-soft:rgba(255,69,58,.16); --ok:#30d158;
  --page-shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.45);
  --pop-shadow:0 0 0 .5px rgba(255,255,255,.12), 0 14px 36px rgba(0,0,0,.55);
  --ctrl-shadow:0 0 0 .5px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.5); color-scheme:dark; }}
:root[data-theme="dark"]{
  --win:#1c1c1e; --canvas:#111113; --glass:rgba(44,44,48,.66); --glass-strong:rgba(50,50,54,.88); --glass-edge:rgba(255,255,255,.10);
  --sidebar:rgba(36,36,40,.66); --label:#f5f5f7; --label-2:#d1d1d6; --label-3:#a1a1a6; --sep:rgba(255,255,255,.10); --sep-strong:rgba(255,255,255,.16);
  --fill:rgba(255,255,255,.07); --fill-2:rgba(255,255,255,.11); --fill-hover:rgba(255,255,255,.10); --control:#636366;
  --accent:#0a84ff; --accent-ink:#ffffff; --accent-soft:rgba(10,132,255,.22); --danger:#ff453a; --danger-soft:rgba(255,69,58,.16); --ok:#30d158;
  --page-shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.45);
  --pop-shadow:0 0 0 .5px rgba(255,255,255,.12), 0 14px 36px rgba(0,0,0,.55);
  --ctrl-shadow:0 0 0 .5px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.5); color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--win);color:var(--label);font-family:var(--font);font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:1px}

.app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px)}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}

/* Toolbar */
.toolbar{position:relative;z-index:30;height:var(--tb-h);display:flex;align-items:center;gap:10px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:.5px solid var(--sep-strong)}
.tb-left,.tb-right{display:flex;align-items:center;gap:6px;min-width:0}
.tb-left{flex:1 1 0}
.tb-right{flex:1 1 0;justify-content:flex-end}
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:36px;height:34px;padding:0 9px;border:0;border-radius:999px;background:transparent;color:var(--label-2);transition:background-color .15s var(--ease),color .15s,transform .1s}
.tbtn:hover{background:var(--fill-hover);color:var(--label)}
.tbtn:active{transform:scale(.96)}
.tbtn[disabled]{opacity:.35;pointer-events:none}
.tbtn[aria-pressed="true"]{background:var(--fill-2);color:var(--label)}
.tbtn.primary{background:var(--accent);color:var(--accent-ink);padding:0 14px;font-weight:600}
.tbtn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.capsule{display:inline-flex;align-items:center;gap:2px;padding:2px;border-radius:999px;background:var(--fill);box-shadow:inset 0 0 0 .5px var(--sep)}
.capsule .tbtn{height:30px;min-width:32px}
.docname{display:flex;flex-direction:column;min-width:0;padding-left:4px}
.docname input{border:0;background:transparent;font-weight:600;font-size:14px;color:var(--label);padding:2px 6px;border-radius:6px;min-width:0;width:100%;max-width:280px;text-overflow:ellipsis}
.docname input:hover{background:var(--fill)}
.docname input:focus{background:var(--control);box-shadow:0 0 0 3px var(--accent-soft),0 0 0 1px var(--accent);outline:none}
.docname small{font-size:11px;color:var(--label-3);padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zoomlbl{min-width:46px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums;color:var(--label-2);border:0;background:transparent;height:30px;border-radius:999px}
.zoomlbl:hover{background:var(--fill-hover)}

/* Tools: segmented glass capsule */
.tools{display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:var(--fill);box-shadow:inset 0 0 0 .5px var(--sep);flex:none}
.tool{position:relative;display:inline-flex;align-items:center;justify-content:center;width:36px;height:30px;border:0;border-radius:999px;background:transparent;color:var(--label-2);transition:background-color .15s var(--ease),color .15s,box-shadow .15s}
.tool:hover{color:var(--label);background:var(--fill-hover)}
.tool[aria-pressed="true"]{background:var(--control);color:var(--accent);box-shadow:var(--ctrl-shadow)}
.tool .tip{display:none}
.tsep{width:1px;height:18px;background:var(--sep-strong);margin:0 3px}

/* Format bar */
.stage{position:relative;flex:1;min-width:0;display:flex}
.formatbar{position:absolute;z-index:25;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;flex-wrap:nowrap;white-space:nowrap;
  min-height:44px;max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none;padding:5px 8px 5px 16px;border-radius:999px;
  background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--pop-shadow);border:.5px solid var(--glass-edge);animation:fbin .2s var(--ease)}
.formatbar::-webkit-scrollbar{display:none}
@keyframes fbin{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,0)}}
.fb-label{font-size:12px;font-weight:600;color:var(--label-3)}
.swatches{display:flex;gap:6px}
.sw{width:22px;height:22px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);position:relative}
.sw[aria-pressed="true"]::after{content:"";position:absolute;inset:-4px;border-radius:50%;box-shadow:0 0 0 2px var(--accent)}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--fill);border-radius:999px;padding:2px;box-shadow:inset 0 0 0 .5px var(--sep)}
.stepper button{width:28px;height:26px;border:0;border-radius:999px;background:transparent;color:var(--label-2);font-size:16px;line-height:1}
.stepper button:hover{background:var(--fill-hover)}
.stepper output{min-width:42px;text-align:center;font-variant-numeric:tabular-nums;font-size:12px;font-weight:600}
.fb-spacer{flex:0 0 2px}
.fb-hint{font-size:12px;color:var(--label-3)}

/* Body */
.body{position:relative;flex:1;display:flex;min-height:0}
.sidebar{width:220px;flex:none;display:flex;flex-direction:column;border-right:.5px solid var(--sep-strong);background:var(--sidebar);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  transition:margin-left .25s var(--ease);z-index:20}
.app.no-sidebar .sidebar{margin-left:-220px}
.sb-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 6px 16px}
.sb-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--label-3)}
.sb-list{flex:1;overflow-y:auto;padding:6px 12px 12px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.thumb{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;padding:6px;border-radius:10px;color:var(--label-2);position:relative}
.thumb:hover{background:var(--fill)}
.thumb .tw{position:relative;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.12);border-radius:3px;overflow:hidden;line-height:0}
.thumb canvas{display:block;max-width:150px;max-height:200px}
.thumb .tn{font-size:11px;font-variant-numeric:tabular-nums;padding:1px 8px;border-radius:999px}
.thumb.current .tw{box-shadow:0 0 0 3px var(--accent),0 2px 6px rgba(0,0,0,.12)}
.thumb.current .tn{background:var(--accent);color:var(--accent-ink);font-weight:600}
.thumb.sel{background:var(--accent-soft)}
.thumb .chk{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--glass-strong);box-shadow:inset 0 0 0 1.5px var(--sep-strong);display:none;align-items:center;justify-content:center;color:#fff}
.sidebar.selecting .thumb .chk{display:flex}
.thumb.sel .chk{background:var(--accent);box-shadow:none}
.thumb.drop-before::before{content:"";position:absolute;left:10px;right:10px;top:-8px;height:3px;border-radius:2px;background:var(--accent)}
.sb-foot{display:flex;align-items:center;justify-content:space-between;gap:2px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));border-top:.5px solid var(--sep)}
.sb-foot .tbtn{min-width:30px;height:30px;padding:0 6px}

.viewer{position:relative;flex:1;min-width:0;overflow:auto;background:var(--canvas);overscroll-behavior:contain}
.pages{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;padding:72px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));min-width:min-content}
.page{position:relative;background:#fff;box-shadow:var(--page-shadow);flex:none}
.page canvas{position:absolute;inset:0;width:100%;height:100%}
.page svg.ov{position:absolute;inset:0;width:100%;height:100%;overflow:visible;touch-action:pan-x pan-y pinch-zoom}
.viewer.drawing .page svg.ov{touch-action:none;cursor:crosshair}
.viewer.drawing[data-tool="text"] .page svg.ov{cursor:text}
.page .pnum{position:absolute;left:50%;bottom:-19px;transform:translateX(-50%);font-size:11px;color:var(--label-3);font-variant-numeric:tabular-nums}
.ann{cursor:move;touch-action:none}
.viewer.drawing .ann{cursor:inherit}
.selbox{fill:none;stroke:var(--accent);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-dasharray:4 3;pointer-events:none}
.handle-hit{fill:transparent;stroke:none;cursor:nwse-resize;touch-action:none}
.handle{fill:#fff;stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:nwse-resize;touch-action:none}
.pageind{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--label-2);box-shadow:var(--pop-shadow);pointer-events:none}
.textedit{position:absolute;z-index:12;margin:0;padding:0;border:0;outline:1.5px solid var(--accent);outline-offset:2px;border-radius:2px;background:rgba(255,255,255,.85);resize:none;overflow:hidden;font-family:Helvetica,Arial,"Liberation Sans",sans-serif;line-height:1.2;white-space:pre;color:#000}

.ff{position:absolute;margin:0;border:0;border-radius:2px;padding:0 3px;background:rgba(0,122,255,.11);box-shadow:inset 0 0 0 1px rgba(0,122,255,.30);color:#000;font-family:Helvetica,Arial,"Liberation Sans",sans-serif;line-height:1.15;resize:none;transition:box-shadow .15s,background-color .15s;color-scheme:light}
.ff:hover{background:rgba(0,122,255,.17)}
.ff:focus{outline:none;background:rgba(255,255,255,.96);box-shadow:0 0 0 2px var(--accent),0 2px 8px rgba(0,0,0,.15)}
.ff:disabled{background:transparent;box-shadow:none}
button.ff{display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
button.ff svg.i{width:85%;height:85%;stroke-width:2.6;color:#000}
textarea.ff{padding-top:2px;white-space:pre-wrap}
select.ff{padding:0 2px;appearance:auto}

/* Empty state */
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
.empty-card{max-width:520px;width:100%;text-align:center;padding:36px 28px;border-radius:22px;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--pop-shadow);border:1px solid var(--glass-edge)}
.empty-ic{width:76px;height:92px;margin:0 auto 18px;position:relative}
.empty h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.empty p{margin:0 auto 22px;color:var(--label-3);font-size:14px;max-width:38ch}
.empty .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;border:0;background:var(--fill-2);color:var(--label);font-weight:600;transition:background-color .15s,transform .1s}
.btn:hover{background:color-mix(in srgb,var(--label) 14%,transparent)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn[disabled]{opacity:.45;pointer-events:none}
.feat{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:22px;font-size:12px;color:var(--label-3)}
.feat span{display:inline-flex;align-items:center;gap:5px}
.feat svg.i{width:14px;height:14px}
.dropmask{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--accent) 14%,transparent);border:3px dashed var(--accent);border-radius:18px;margin:10px;pointer-events:none;font-size:18px;font-weight:600;color:var(--accent)}

/* Menus, sheets */
.menu{position:fixed;z-index:60;min-width:220px;padding:5px;border-radius:12px;background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--pop-shadow);border:.5px solid var(--glass-edge);animation:pop .16s var(--ease)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;border-radius:7px;background:transparent;text-align:left;color:var(--label)}
.menu button:hover,.menu button:focus-visible{background:var(--accent);color:var(--accent-ink);outline:none}
.menu button kbd{margin-left:auto;font-family:var(--font);font-size:12px;opacity:.6}
.menu hr{border:0;height:.5px;background:var(--sep-strong);margin:5px 8px}
.menu .mh{font-size:11px;font-weight:600;color:var(--label-3);padding:6px 10px 2px}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(-4px)}to{opacity:1;transform:none}}
.scrim{position:fixed;inset:0;z-index:70;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:460px;max-height:calc(100% - 32px);overflow:auto;border-radius:18px;background:var(--glass-strong);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);box-shadow:var(--pop-shadow);border:.5px solid var(--glass-edge);padding:20px;animation:sheetin .22s var(--ease)}
.sheet.wide{max-width:640px}
@keyframes sheetin{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.sheet h2{font-size:17px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.sheet .sub{color:var(--label-3);margin:0 0 16px;font-size:13px}
.sheet .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label,.flabel{font-size:12px;font-weight:600;color:var(--label-2)}
.inp{height:36px;padding:0 11px;border-radius:9px;border:0;background:var(--control);box-shadow:inset 0 0 0 .5px var(--sep-strong),0 .5px 1px rgba(0,0,0,.05);color:var(--label);width:100%;min-width:0}
textarea.inp{height:auto;min-height:70px;padding:8px 11px;resize:vertical}
.inp:focus{outline:none;box-shadow:0 0 0 3px var(--accent-soft),inset 0 0 0 1px var(--accent)}
.seg{display:inline-flex;padding:2px;border-radius:9px;background:var(--fill-2);gap:2px;width:100%}
.seg button{flex:1;height:30px;border:0;border-radius:7px;background:transparent;color:var(--label-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--control);color:var(--label);box-shadow:var(--ctrl-shadow);font-weight:600}
.chkrow{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer}
.chkrow input{width:18px;height:18px;accent-color:var(--accent)}
.sigpad{position:relative;width:100%;aspect-ratio:3/1.2;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 .5px var(--sep-strong);touch-action:none;overflow:hidden}
.sigpad canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.sigpad .line{position:absolute;left:8%;right:8%;bottom:26%;border-bottom:1px solid #c7c7cc;pointer-events:none}
.sigpad .x{position:absolute;left:5%;bottom:27%;font-size:16px;color:#aeaeb2;pointer-events:none}
.sigpad .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#aeaeb2;pointer-events:none;font-size:14px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:6px}
.libitem{position:relative;height:84px;border:0;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 .5px var(--sep-strong);display:flex;align-items:center;justify-content:center;padding:10px;transition:box-shadow .15s,transform .1s}
.libitem:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.libitem:active{transform:scale(.97)}
.libitem img{max-width:100%;max-height:100%;object-fit:contain}
.libitem .del{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.libitem:hover .del,.libitem:focus-within .del{opacity:1}
@media (hover:none){.libitem .del{opacity:1}}
.libitem .del svg.i{width:12px;height:12px}
.tabs2{margin-bottom:14px}
.empty-lib{padding:18px;text-align:center;color:var(--label-3);border-radius:12px;background:var(--fill);margin-bottom:6px}
.formlist{display:flex;flex-direction:column;gap:2px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;align-items:center;padding:6px 0;border-bottom:.5px solid var(--sep)}
.frow label{font-size:12px;color:var(--label-2);word-break:break-word}
.frow .inp{height:32px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;padding:9px 16px;border-radius:999px;background:var(--glass-strong);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);box-shadow:var(--pop-shadow);font-weight:600;display:flex;align-items:center;gap:8px;animation:sheetin .2s var(--ease);max-width:calc(100% - 32px)}
.toast.err{color:var(--danger)}
.progress{height:4px;border-radius:2px;background:var(--fill-2);overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#printRoot{display:none}
@media print{
  @page{margin:0}
  @page landscape{size:landscape;margin:0}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block}
  #printRoot .pp{break-after:page;page-break-after:always;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #printRoot .pp.pl{page:landscape}
  #printRoot .pp:last-child{break-after:auto;page-break-after:auto}
  #printRoot img{max-width:100%;max-height:100%;object-fit:contain}
}

/* Phone */
@media (max-width: 760px){
  :root{--tb-h:52px}
  .tb-hide-m{display:none!important}
  .docname input{font-size:15px}
  .tools{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;padding:5px;max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none;
    background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--pop-shadow);border:.5px solid var(--glass-edge)}
  .tools::-webkit-scrollbar{display:none}
  .tool{width:42px;height:40px;flex:none}
  .sidebar{position:absolute;left:0;top:0;bottom:0;width:200px;box-shadow:var(--pop-shadow)}
  .app.no-sidebar .sidebar{margin-left:-210px;box-shadow:none}
  .pageind{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
  .formatbar{gap:10px}
  .fb-hint{display:none}
  .pages{padding-top:66px;gap:18px}
  .formatbar{top:8px;gap:8px;padding-left:12px}
  .inp{font-size:16px}
}
@media (min-width: 761px){ .tb-show-m{display:none!important} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="app no-sidebar" id="app">
  <header class="toolbar glass">
    <div class="tb-left">
      <button class="tbtn" id="btnSidebar" aria-label="Show page sidebar" aria-pressed="false" title="Sidebar"></button>
      <div class="docname">
        <input id="docName" value="Untitled" aria-label="File name" spellcheck="false" autocomplete="off">
        <small id="docMeta">No document</small>
      </div>
    </div>
    <div class="tools" id="tools" role="toolbar" aria-label="Markup tools"></div>
    <div class="tb-right">
      <div class="capsule tb-hide-m" role="group" aria-label="Zoom">
        <button class="tbtn" id="zoomOut" aria-label="Zoom out" title="Zoom out"></button>
        <button class="zoomlbl" id="zoomLbl" title="Fit to width">100%</button>
        <button class="tbtn" id="zoomIn" aria-label="Zoom in" title="Zoom in"></button>
      </div>
      <button class="tbtn" id="btnUndo" aria-label="Undo" title="Undo (Ctrl+Z)" disabled></button>
      <button class="tbtn tb-hide-m" id="btnRedo" aria-label="Redo" title="Redo (Ctrl+Shift+Z)" disabled></button>
      <button class="tbtn" id="btnInstall" aria-label="Install app" title="Install PDF Mate" hidden></button>
      <button class="tbtn" id="btnOpen" aria-label="Open or add files" title="Open or add files"></button>
      <button class="tbtn" id="btnMore" aria-label="More" title="More" aria-haspopup="menu"></button>
      <button class="tbtn tb-hide-m" id="btnPrint" aria-label="Print" title="Print (Ctrl+P)" disabled></button>
      <button class="tbtn primary" id="btnSave" disabled><span id="saveIc"></span><span class="tb-hide-m">Save</span></button>
    </div>
  </header>
  <div class="body">
    <aside class="sidebar" id="sidebar" aria-label="Pages">
      <div class="sb-head"><span class="sb-title" id="sbTitle">Pages</span><button class="tbtn" id="btnSelPages" style="height:26px;font-size:12px;font-weight:600">Select</button></div>
      <div class="sb-list" id="sbList"></div>
      <div class="sb-foot" id="sbFoot">
        <button class="tbtn" data-pa="rotl" aria-label="Rotate left" title="Rotate left"></button>
        <button class="tbtn" data-pa="rotr" aria-label="Rotate right" title="Rotate right"></button>
        <button class="tbtn" data-pa="up" aria-label="Move up" title="Move up"></button>
        <button class="tbtn" data-pa="down" aria-label="Move down" title="Move down"></button>
        <button class="tbtn" data-pa="blank" aria-label="Insert blank page after" title="Insert blank page"></button>
        <button class="tbtn" data-pa="del" aria-label="Delete page" title="Delete page" style="color:var(--danger)"></button>
      </div>
    </aside>
    <div class="stage">
    <div class="formatbar" id="formatBar" role="toolbar" aria-label="Format" hidden></div>
    <main class="viewer" id="viewer" tabindex="-1">
      <div class="pages" id="pages"></div>
      <div class="empty" id="empty">
        <div class="empty-card">
          <div class="empty-ic" id="emptyIc"></div>
          <h1>Open a PDF to get started</h1>
          <p>Fill, sign, stamp and mark up documents. Merge, reorder and rotate pages. Everything stays on this device.</p>
          <div class="acts">
            <button class="btn primary" id="eOpen">Choose PDF</button>
            <button class="btn" id="ePhotos">Photos to PDF</button>
            <button class="btn" id="eBlank">Blank page</button>
          </div>
          <div class="feat" id="feat"></div>
          <button class="btn" id="eInstall" style="margin-top:18px" hidden>Install app</button>
        </div>
      </div>
    </main>
    <div class="pageind glass" id="pageInd" hidden>1 / 1</div>
    </div>
  </div>
</div>
<input type="file" id="fileOpen" accept="application/pdf,.pdf,image/*" multiple hidden>
<input type="file" id="fileImg" accept="image/*" multiple hidden>
<input type="file" id="fileStamp" accept="image/*" hidden>
<div id="layer"></div>
<script src="vendor/pdf-lib.min.js"></script>
<script type="module" src="app.js?v=4"></script>
</body>
</html>
