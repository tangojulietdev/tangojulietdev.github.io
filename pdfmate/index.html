<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian PDF Mate has moved</title>
<meta http-equiv="refresh" content="2; url=https://tangojulietdev.github.io/Meridian-Pdf-Mate/">
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font:15px -apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:#f5f5f7;color:#1d1d1f;padding:16px}a{color:#007aff}@media(prefers-color-scheme:dark){body{background:#1c1c1e;color:#f5f5f7}a{color:#0a84ff}}</style>
</head>
<body>
<p>PDF Mate is now <a href="https://tangojulietdev.github.io/Meridian-Pdf-Mate/">Meridian PDF Mate</a>. Taking you there.</p>
<script>
(async () => {
  try {
    if ('serviceWorker' in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) if (new URL(r.scope).pathname === '/pdfmate/') await r.unregister();
    if ('caches' in window) for (const k of await caches.keys()) if (/^pdfmate-/.test(k)) await caches.delete(k);
  } catch (e) {}
  location.replace('https://tangojulietdev.github.io/Meridian-Pdf-Mate/');
})();
</script>
</body>
</html>
